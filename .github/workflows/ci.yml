name: CI

on:
  push:
    branches:
      - main
      - "migration/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run hardware-free tests
        run: python -m pytest -m "not hardware"

  quality:
    name: Quality and package artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff formatting
        run: ruff format --check .

      - name: Mypy
        run: mypy src/autowave

      - name: Coverage gate
        env:
          HYPOTHESIS_PROFILE: ci
        run: python -m pytest -m "not hardware" --cov=autowave --cov-report=term-missing

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify artifact set
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_names = set(archive.namelist())
          required_wheel = {
              "AutoWave_class.py",
              "Timer_class.py",
              "autowave/__init__.py",
              "autowave/_version.py",
              "autowave/py.typed",
          }
          assert required_wheel <= wheel_names, required_wheel - wheel_names
          assert not any(name.startswith("Doxygen/") or name.startswith(".idea/") for name in wheel_names)

          with tarfile.open(sdists[0], "r:gz") as archive:
              sdist_names = set(archive.getnames())
          assert any(name.endswith("/VERSION") for name in sdist_names)
          assert any(name.endswith("/CHANGELOG.md") for name in sdist_names)
          assert any(name.endswith("/docs/PACKAGING.md") for name in sdist_names)

          print("wheel:", wheels[0])
          print("sdist:", sdists[0])
          PY

      - name: Clean-install wheel
        run: |
          python -m venv /tmp/autowave-wheel
          /tmp/autowave-wheel/bin/python -m pip install --upgrade pip
          /tmp/autowave-wheel/bin/python -m pip install dist/*.whl
          /tmp/autowave-wheel/bin/python - <<'PY'
          from importlib import metadata
          from importlib.resources import files
          import autowave
          import AutoWave_class
          import Timer_class

          assert autowave.__version__ == "0.2.0"
          assert metadata.version("autowave-driver") == "0.2.0"
          assert metadata.version("scpi-driver-core") == "0.1.0.dev6"
          assert files("autowave").joinpath("py.typed").is_file()
          assert hasattr(AutoWave_class, "com_interface")
          assert hasattr(Timer_class, "Timer")
          PY

      - name: Clean-install sdist
        run: |
          python -m venv /tmp/autowave-sdist
          /tmp/autowave-sdist/bin/python -m pip install --upgrade pip
          /tmp/autowave-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/autowave-sdist/bin/python - <<'PY'
          from importlib import metadata
          import autowave
          import AutoWave_class
          import Timer_class

          assert autowave.__version__ == "0.2.0"
          assert metadata.version("autowave-driver") == "0.2.0"
          assert metadata.version("scpi-driver-core") == "0.1.0.dev6"
          assert hasattr(AutoWave_class, "com_interface")
          assert hasattr(Timer_class, "Timer")
          PY
